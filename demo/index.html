<!-- demo/index.html
     Static shell for the live-demo page. The tour engine (demo.js), tutorial
     copy (steps.js), and generated signal-manifest.json populate #card, the
     live session record ([data-role="live-pane"]) and the instrument
     column's lamps (#rail / [data-role="rail"]) at runtime — this file only
     lays out the topbar (the brand, then the REC cue demo.js shows once the
     session records), two-column grid, and script load order.

     [data-role="pane-slot"] is the live session record's permanent home,
     under the step card on every step. It is a sibling of #card, not part
     of it, so renderStep()'s innerHTML rebuild of #card never touches the
     record, and it lives inside .main-col (not as a third .cols child) so it
     stays in the main column's grid cell in both the 2-col and ≤820px
     single-column layouts. The instrument column holds the step's detected
     signals and the lamps only, short enough to stay in view (sticky) while
     the step scrolls. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cyborg-hunter — live demo</title>
<link rel="stylesheet" href="./demo.css">
</head>
<body>

<div class="topbar">
  <span class="brand">cyborg-hunter · live demo</span>
  <span class="rec" id="rec" hidden><span class="dot"></span>REC replay</span>
</div>

<div class="cols">
  <div class="main-col">
    <main id="card"></main>
    <div class="pane-slot" data-role="pane-slot">
      <div class="card" data-role="live-pane"></div>
    </div>
  </div>
  <aside class="instrument" aria-label="Demo instrument column">
    <div class="card" id="rail" data-role="rail"></div>
  </aside>
</div>

<div id="smallmode" hidden></div>

<script src="./dist/cyborg-hunter.min.js"></script>
<script src="./dist/extension-cyborg-hunter.js"></script>
<script src="./dist/extension-guard-friction.js"></script>
<script src="./dist/cyborg-hunter-replay.js"></script>
<script type="module" src="./demo.js"></script>
</body>
</html>
